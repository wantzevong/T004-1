<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>T04 – SVG House &amp; Garden</title>
	<style>
		body {
			margin: 0;
			padding: 2rem;
			background: #f4f7f2;
			font-family: Arial, sans-serif;
			text-align: center;
		}

		svg {
			display: block;
			width: min(100%, 800px);
			height: auto;
			margin: 0 auto;
			border: 3px solid #365f43;
			background: #bfe8f5;
		}
	</style>
</head>
<body>
	<svg viewBox="0 0 800 500" role="img" aria-labelledby="svg-title svg-desc">
		<title id="svg-title">A house and garden scene</title>
		<desc id="svg-desc">A sunny garden with a cloud, tree, fenced house, curved path, and caption.</desc>

		<!-- Sky and grass -->
		<rect x="0" y="0" width="800" height="500" fill="#bfe8f5"></rect>
		<rect x="0" y="350" width="800" height="150" fill="#8fcf70"></rect>

		<!-- Sun -->
		<circle cx="680" cy="95" r="48" fill="#ffd45a" stroke="#e6a92f" stroke-width="4"></circle>
		<line x1="680" y1="25" x2="680" y2="5" stroke="#e6a92f" stroke-width="5"></line>
		<line x1="680" y1="165" x2="680" y2="185" stroke="#e6a92f" stroke-width="5"></line>
		<line x1="610" y1="95" x2="590" y2="95" stroke="#e6a92f" stroke-width="5"></line>
		<line x1="750" y1="95" x2="770" y2="95" stroke="#e6a92f" stroke-width="5"></line>

		<!-- Cloud -->
		<ellipse cx="170" cy="100" rx="70" ry="28" fill="#ffffff"></ellipse>
		<circle cx="135" cy="93" r="28" fill="#ffffff"></circle>
		<circle cx="185" cy="82" r="36" fill="#ffffff"></circle>
		<circle cx="225" cy="96" r="24" fill="#ffffff"></circle>

		<!-- Tree -->
		<rect x="92" y="245" width="32" height="125" fill="#80552f"></rect>
		<circle cx="108" cy="205" r="62" fill="#4f9c52"></circle>
		<circle cx="65" cy="235" r="48" fill="#5eaa58"></circle>
		<circle cx="153" cy="235" r="48" fill="#438b49"></circle>

		<!-- House -->
		<rect x="270" y="245" width="300" height="170" fill="#f2c078" stroke="#70452d" stroke-width="5"></rect>
		<polygon points="240,250 420,105 600,250" fill="#b95545" stroke="#70452d" stroke-width="5"></polygon>
		<rect x="500" y="145" width="38" height="78" fill="#8c5b45" stroke="#70452d" stroke-width="4"></rect>
		<rect x="350" y="320" width="72" height="95" fill="#744b38" stroke="#543525" stroke-width="4"></rect>
		<circle cx="407" cy="368" r="5" fill="#ffd45a"></circle>

		<!-- Windows -->
		<rect x="295" y="285" width="62" height="52" fill="#9edff0" stroke="#70452d" stroke-width="4"></rect>
		<line x1="326" y1="285" x2="326" y2="337" stroke="#70452d" stroke-width="4"></line>
		<line x1="295" y1="311" x2="357" y2="311" stroke="#70452d" stroke-width="4"></line>
		<rect x="468" y="285" width="62" height="52" fill="#9edff0" stroke="#70452d" stroke-width="4"></rect>
		<line x1="499" y1="285" x2="499" y2="337" stroke="#70452d" stroke-width="4"></line>
		<line x1="468" y1="311" x2="530" y2="311" stroke="#70452d" stroke-width="4"></line>

		<!-- Fence -->
		<polyline points="25,370 25,320 50,345 50,320 75,345 75,320 100,345 100,320 125,345 125,370" fill="none" stroke="#754c2d" stroke-width="7"></polyline>
		<line x1="18" y1="350" x2="135" y2="350" stroke="#754c2d" stroke-width="6"></line>
		<line x1="18" y1="372" x2="135" y2="372" stroke="#754c2d" stroke-width="6"></line>

		<!-- Curved garden path -->
		<path d="M 386 500 C 380 460, 405 430, 386 415 C 370 402, 370 390, 386 375" fill="none" stroke="#d8b477" stroke-width="42" stroke-linecap="round"></path>
		<path d="M 386 500 C 380 460, 405 430, 386 415 C 370 402, 370 390, 386 375" fill="none" stroke="#efd49b" stroke-width="34" stroke-linecap="round"></path>

		<!-- Garden details and caption -->
		<polygon points="650,380 665,350 680,380" fill="#3e8f4a"></polygon>
		<polygon points="690,380 707,342 724,380" fill="#4da354"></polygon>
		<text x="400" y="475" fill="#24452d" font-size="24" font-weight="bold" text-anchor="middle">Welcome to our house and garden</text>
	</svg>
</body>
</html>
